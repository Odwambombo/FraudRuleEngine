services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1-local}
        VCS_REF: ${VCS_REF:-local}
    image: fraud-rule-engine:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_STAGING_SECRET_NAME: ${AWS_STAGING_SECRET_NAME:-/fraud-rule-engine/staging}
      AWS_PRODUCTION_SECRET_NAME: ${AWS_PRODUCTION_SECRET_NAME:-/fraud-rule-engine/production}
      FRAUD_DB_URL: jdbc:postgresql://postgres:5432/fraud_rule_engine
      FRAUD_DB_USERNAME: ${FRAUD_DB_USERNAME:-fraud}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
      FRAUD_DB_POOL_MAX_SIZE: ${FRAUD_DB_POOL_MAX_SIZE:-5}
      FRAUD_DB_POOL_MIN_IDLE: ${FRAUD_DB_POOL_MIN_IDLE:-1}
      FRAUD_OAUTH2_ISSUER_URI: ${FRAUD_OAUTH2_ISSUER_URI:-http://localhost:8080}
      FRAUD_OAUTH2_AUDIENCE: ${FRAUD_OAUTH2_AUDIENCE:-fraud-rule-engine}
      FRAUD_SCOPE_TRANSACTION_WRITE: "${FRAUD_SCOPE_TRANSACTION_WRITE:-}"
      FRAUD_SCOPE_ASSESSMENT_READ: "${FRAUD_SCOPE_ASSESSMENT_READ:-}"
      FRAUD_SCOPE_OPERATIONS_READ: "${FRAUD_SCOPE_OPERATIONS_READ:-}"
      FRAUD_SCOPE_DOCS_READ: "${FRAUD_SCOPE_DOCS_READ:-}"
      FRAUD_COGNITO_DOMAIN: ${FRAUD_COGNITO_DOMAIN:-}
      FRAUD_COGNITO_CLIENT_ID: ${FRAUD_COGNITO_CLIENT_ID:-}
      FRAUD_COGNITO_SIGNUP_ENABLED: ${FRAUD_COGNITO_SIGNUP_ENABLED:-false}
      FRAUD_RATE_LIMIT_ENABLED: ${FRAUD_RATE_LIMIT_ENABLED:-true}
      FRAUD_RATE_LIMIT_MAX_CLIENT_BUCKETS: ${FRAUD_RATE_LIMIT_MAX_CLIENT_BUCKETS:-100000}
      FRAUD_RATE_LIMIT_CLIENT_IDLE_TIME: ${FRAUD_RATE_LIMIT_CLIENT_IDLE_TIME:-10m}
      FRAUD_API_RATE_LIMIT_PER_MINUTE: ${FRAUD_API_RATE_LIMIT_PER_MINUTE:-1200}
      FRAUD_API_RATE_LIMIT_PER_SECOND: ${FRAUD_API_RATE_LIMIT_PER_SECOND:-100}
      FRAUD_LOGIN_RATE_LIMIT_PER_MINUTE: ${FRAUD_LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      FRAUD_LOGIN_RATE_LIMIT_PER_SECOND: ${FRAUD_LOGIN_RATE_LIMIT_PER_SECOND:-3}
      FRAUD_LOCAL_JWT_SIGNING_KEY: ${FRAUD_LOCAL_JWT_SIGNING_KEY:-fraud-rule-engine-local-development-signing-key-change-before-sharing}
      FRAUD_LOCAL_JWT_TTL: ${FRAUD_LOCAL_JWT_TTL:-15m}
      FRAUD_LOCAL_ADMIN_USERNAME: ${FRAUD_LOCAL_ADMIN_USERNAME:-local-admin}
      FRAUD_LOCAL_ADMIN_PASSWORD: ${FRAUD_LOCAL_ADMIN_PASSWORD:-local-admin-change-me}
      FRAUD_LOCAL_ADMIN_ROLES: ${FRAUD_LOCAL_ADMIN_ROLES:-ADMIN}
      FRAUD_LOCAL_ADMIN_PERMISSIONS: ${FRAUD_LOCAL_ADMIN_PERMISSIONS:-TRANSACTION_WRITE,ASSESSMENT_READ,OPERATIONS_READ,DOCS_READ}
      FRAUD_LOCAL_OPERATOR_USERNAME: ${FRAUD_LOCAL_OPERATOR_USERNAME:-local-operator}
      FRAUD_LOCAL_OPERATOR_PASSWORD: ${FRAUD_LOCAL_OPERATOR_PASSWORD:-local-operator-change-me}
      FRAUD_LOCAL_OPERATOR_ROLES: ${FRAUD_LOCAL_OPERATOR_ROLES:-OPERATOR}
      FRAUD_LOCAL_OPERATOR_PERMISSIONS: ${FRAUD_LOCAL_OPERATOR_PERMISSIONS:-TRANSACTION_WRITE}
      FRAUD_LOCAL_ANALYST_USERNAME: ${FRAUD_LOCAL_ANALYST_USERNAME:-local-analyst}
      FRAUD_LOCAL_ANALYST_PASSWORD: ${FRAUD_LOCAL_ANALYST_PASSWORD:-local-analyst-change-me}
      FRAUD_LOCAL_ANALYST_ROLES: ${FRAUD_LOCAL_ANALYST_ROLES:-ANALYST}
      FRAUD_LOCAL_ANALYST_PERMISSIONS: ${FRAUD_LOCAL_ANALYST_PERMISSIONS:-ASSESSMENT_READ}
      SPRING_LIQUIBASE_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_SERVICE_NAME: fraud-rule-engine
      OTEL_SERVICE_VERSION: ${APP_VERSION:-0.0.1-local}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:${FRAUD_APP_PORT:-8080}:8080"
      - "127.0.0.1:${FRAUD_MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      observability:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraud_rule_engine
      POSTGRES_USER: ${FRAUD_DB_USERNAME:-fraud}
      POSTGRES_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
    ports:
      - "127.0.0.1:${FRAUD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fraud-rule-engine-data:/var/lib/postgresql/data

  observability:
    image: grafana/otel-lgtm:0.27.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GRAFANA_ALERT_ENVIRONMENT: ${GRAFANA_ALERT_ENVIRONMENT:-local}
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://alert-webhook:8080/cgi-bin/alerts}
      GRAFANA_ALERT_WEBHOOK_AUTH_SCHEME: ${GRAFANA_ALERT_WEBHOOK_AUTH_SCHEME:-}
      GRAFANA_ALERT_WEBHOOK_AUTH_CREDENTIALS: ${GRAFANA_ALERT_WEBHOOK_AUTH_CREDENTIALS:-}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      alert-webhook:
        condition: service_healthy
    volumes:
      - fraud-rule-engine-observability:/data
      - ./observability/grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro

  alert-webhook:
    build:
      context: ./observability/webhook-test
      dockerfile: Dockerfile
    image: fraud-rule-engine-alert-webhook:local
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fraud-rule-engine-data:
  fraud-rule-engine-observability:
