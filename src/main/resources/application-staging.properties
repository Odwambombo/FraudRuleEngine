spring.config.activate.on-profile=staging
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.config.import=optional:aws-secretsmanager:${AWS_STAGING_SECRET_NAME:/fraud-rule-engine/staging}?prefix=spring.datasource.

spring.datasource.url=${FRAUD_DB_URL}
spring.datasource.username=${FRAUD_DB_USERNAME}
spring.datasource.password=${FRAUD_DB_PASSWORD}

spring.cloud.aws.region.static=${AWS_REGION:af-south-1}
spring.cloud.aws.secretsmanager.region=${AWS_REGION:af-south-1}
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:false}

# Hosted web processes are fail-closed by HostedSecurityStartupConfiguration.
fraud.security.enabled=true
fraud.security.provider=cognito
fraud.security.issuer-uri=${FRAUD_OAUTH2_ISSUER_URI:}
fraud.security.audience=${FRAUD_OAUTH2_AUDIENCE:}
fraud.security.scopes.transaction-write=${FRAUD_SCOPE_TRANSACTION_WRITE:}
fraud.security.scopes.assessment-read=${FRAUD_SCOPE_ASSESSMENT_READ:}
fraud.security.scopes.operations-read=${FRAUD_SCOPE_OPERATIONS_READ:}
fraud.security.scopes.docs-read=${FRAUD_SCOPE_DOCS_READ:}

server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.com.odwambombo.fraudruleengine=DEBUG

management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoint.health.show-details=when-authorized
management.endpoints.web.discovery.enabled=false
management.opentelemetry.resource-attributes[deployment.environment.name]=${OTEL_DEPLOYMENT_ENVIRONMENT:staging}
management.opentelemetry.logging.export.schedule-delay=2s
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.step=10s
management.metrics.tags.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:staging}

spring.datasource.hikari.maximum-pool-size=${FRAUD_DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${FRAUD_DB_POOL_MIN_IDLE:1}

# Interactive API documentation is a local-development facility. Keep hosted
# documentation disabled even though the security chain remains fail-closed if
# an operator explicitly re-enables it for controlled diagnostics.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
