# Run the application image as a one-shot schema migration task.
spring.main.web-application-type=none
spring.liquibase.enabled=true
fraud.security.enabled=false

# Hikari's native duration setters use milliseconds. These overrides also keep
# the migration task independent from service-pool tuning.
spring.datasource.hikari.connection-timeout=${FRAUD_MIGRATION_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${FRAUD_MIGRATION_DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${FRAUD_MIGRATION_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${FRAUD_MIGRATION_DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${FRAUD_MIGRATION_DB_KEEPALIVE_TIME_MS:120000}

# A migration must not make telemetry network calls. Console logs remain enabled.
management.opentelemetry.enabled=false
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
