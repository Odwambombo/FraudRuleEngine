spring.application.name=FraudRuleEngine
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${FRAUD_DB_URL:jdbc:postgresql://localhost:5432/fraud_rule_engine}
spring.datasource.username=${FRAUD_DB_USERNAME:fraud}
spring.datasource.password=${FRAUD_DB_PASSWORD:fraud}
spring.datasource.hikari.maximum-pool-size=${FRAUD_DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${FRAUD_DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${FRAUD_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${FRAUD_DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${FRAUD_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${FRAUD_DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${FRAUD_DB_KEEPALIVE_TIME_MS:120000}
spring.datasource.hikari.pool-name=FraudRuleEnginePool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.sql

spring.cache.type=caffeine
spring.cache.cache-names=fraudAssessmentsById
spring.cache.caffeine.spec=maximumSize=10000,expireAfterAccess=5m,recordStats

fraud.rate-limit.enabled=${FRAUD_RATE_LIMIT_ENABLED:true}
fraud.rate-limit.max-client-buckets=${FRAUD_RATE_LIMIT_MAX_CLIENT_BUCKETS:100000}
fraud.rate-limit.client-idle-time=${FRAUD_RATE_LIMIT_CLIENT_IDLE_TIME:10m}
fraud.rate-limit.api.requests-per-minute=${FRAUD_API_RATE_LIMIT_PER_MINUTE:1200}
fraud.rate-limit.api.requests-per-second=${FRAUD_API_RATE_LIMIT_PER_SECOND:100}
fraud.rate-limit.login.requests-per-minute=${FRAUD_LOGIN_RATE_LIMIT_PER_MINUTE:10}
fraud.rate-limit.login.requests-per-second=${FRAUD_LOGIN_RATE_LIMIT_PER_SECOND:3}

fraud.risk.medium-threshold=30
fraud.risk.high-threshold=60
fraud.risk.critical-threshold=80
fraud.risk.flag-threshold=60

fraud.rules.high-value.enabled=true
fraud.rules.high-value.currency=ZAR
fraud.rules.high-value.threshold=20000.00
fraud.rules.high-value.score=40

fraud.rules.unusual-time.enabled=true
fraud.rules.unusual-time.start-inclusive=00:00
fraud.rules.unusual-time.end-exclusive=04:00
fraud.rules.unusual-time.score=20

fraud.rules.risky-category.enabled=true
fraud.rules.risky-category.categories=GAMBLING,CRYPTOCURRENCY
fraud.rules.risky-category.score=15

fraud.rules.foreign-transaction.enabled=true
fraud.rules.foreign-transaction.score=25

fraud.rules.velocity.enabled=true
fraud.rules.velocity.minimum-transaction-count=5
fraud.rules.velocity.window=10m
fraud.rules.velocity.score=35

fraud.security.enabled=${FRAUD_SECURITY_ENABLED:true}
fraud.security.provider=${FRAUD_SECURITY_PROVIDER:local}
fraud.security.issuer-uri=${FRAUD_OAUTH2_ISSUER_URI:http://localhost:8080}
fraud.security.audience=${FRAUD_OAUTH2_AUDIENCE:fraud-rule-engine}
fraud.security.local-auth.signing-key=${FRAUD_LOCAL_JWT_SIGNING_KEY:fraud-rule-engine-local-development-signing-key-change-before-sharing}
fraud.security.local-auth.token-ttl=${FRAUD_LOCAL_JWT_TTL:15m}
fraud.security.local-auth.users[0].username=${FRAUD_LOCAL_ADMIN_USERNAME:local-admin}
fraud.security.local-auth.users[0].password=${FRAUD_LOCAL_ADMIN_PASSWORD:local-admin-change-me}
fraud.security.local-auth.users[0].roles=${FRAUD_LOCAL_ADMIN_ROLES:ADMIN}
fraud.security.local-auth.users[0].permissions=${FRAUD_LOCAL_ADMIN_PERMISSIONS:TRANSACTION_WRITE,ASSESSMENT_READ,OPERATIONS_READ,DOCS_READ}
fraud.security.local-auth.users[1].username=${FRAUD_LOCAL_OPERATOR_USERNAME:local-operator}
fraud.security.local-auth.users[1].password=${FRAUD_LOCAL_OPERATOR_PASSWORD:local-operator-change-me}
fraud.security.local-auth.users[1].roles=${FRAUD_LOCAL_OPERATOR_ROLES:OPERATOR}
fraud.security.local-auth.users[1].permissions=${FRAUD_LOCAL_OPERATOR_PERMISSIONS:TRANSACTION_WRITE}
fraud.security.local-auth.users[2].username=${FRAUD_LOCAL_ANALYST_USERNAME:local-analyst}
fraud.security.local-auth.users[2].password=${FRAUD_LOCAL_ANALYST_PASSWORD:local-analyst-change-me}
fraud.security.local-auth.users[2].roles=${FRAUD_LOCAL_ANALYST_ROLES:ANALYST}
fraud.security.local-auth.users[2].permissions=${FRAUD_LOCAL_ANALYST_PERMISSIONS:ASSESSMENT_READ}

fraud.frontend.cognito.domain=${FRAUD_COGNITO_DOMAIN:}
fraud.frontend.cognito.client-id=${FRAUD_COGNITO_CLIENT_ID:}
fraud.frontend.cognito.signup-enabled=${FRAUD_COGNITO_SIGNUP_ENABLED:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.opentelemetry.resource-attributes[service.name]=${OTEL_SERVICE_NAME:fraud-rule-engine}
management.opentelemetry.resource-attributes[service.version]=${OTEL_SERVICE_VERSION:0.0.1-SNAPSHOT}
management.opentelemetry.resource-attributes[deployment.environment.name]=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
management.opentelemetry.logging.export.schedule-delay=2s
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.step=10s
management.metrics.tags.application=${OTEL_SERVICE_NAME:fraud-rule-engine}
management.metrics.tags.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.fraud.transactions.processing.duration=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
