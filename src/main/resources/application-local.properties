spring.config.activate.on-profile=local

# Developer workstations use the in-process, short-lived JWT issuer. The
# configuration class is profile-excluded from staging, production and migration.
fraud.security.enabled=${FRAUD_SECURITY_ENABLED:true}
fraud.security.provider=local

# Local API discovery is intentionally available without a bearer token. The
# transaction and assessment operations shown by Swagger remain JWT-protected.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.opentelemetry.resource-attributes[deployment.environment.name]=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
management.metrics.tags.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
