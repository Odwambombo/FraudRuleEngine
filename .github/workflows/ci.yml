name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test frontend and backend, then build image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Test Storybook stories
        working-directory: src/frontend
        run: npm run test-storybook:ci

      - name: Run backend tests
        run: ./gradlew --no-daemon test

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "APP_VERSION=${GITHUB_SHA}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag fraud-rule-engine:local \
            .

      - name: Start application stack
        run: docker compose up --detach --wait

      - name: Run Playwright browser tests
        working-directory: src/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Print container logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
